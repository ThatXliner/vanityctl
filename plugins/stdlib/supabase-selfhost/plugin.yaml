apiVersion: vanityctl.dev/plugin/v1
name: supabase-selfhost
version: 1.0.0
description: A self-hosted Supabase Compose stack with a scheduled logical backup job.
config:
  compose_file:
    type: string
    default: docker-compose.yml
  backup_schedule:
    type: string
    default: "0 2 * * *"
  database_service:
    type: string
    default: db
secrets:
  env_file:
    required: true
services:
  main:
    type: compose
    description: Supabase self-hosted stack (generated by the standard library plugin)
    directory: "${instance.directory}"
    file: "${config.compose_file}"
    env_file: "${secrets.env_file}"
    restart: unless-stopped
  backup:
    type: job
    description: Supabase logical backup; output is retained in vanityctl job logs
    directory: "${instance.directory}"
    command: docker
    args:
      - compose
      - -f
      - "${config.compose_file}"
      - exec
      - -T
      - "${config.database_service}"
      - pg_dumpall
      - -U
      - postgres
    schedule: "${config.backup_schedule}"
upgradeGuidance: Change the pinned plugin version deliberately, inspect `vanityctl apply --dry-run`, then apply. Review upstream Supabase migration notes before changing the Compose checkout.
removalGuidance: Remove the plugin service declaration and apply. vanityctl stops managing generated resources but never removes the Compose project directory, bind mounts, volumes, database data, or backup logs.
