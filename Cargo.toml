[package]
name = "vanityctl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A single-node declarative control plane for self-hosters"

[lib]
name = "vanityctl"
path = "src/lib.rs"

[[bin]]
name = "vanityctl"
path = "src/bin/vanityctl.rs"

[[bin]]
name = "hostd"
path = "src/bin/hostd.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
